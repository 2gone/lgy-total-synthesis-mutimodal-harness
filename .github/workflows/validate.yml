name: validate-delivery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Harness and tests
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Verify distributed files without API access
        run: python -m harness validate --offline
