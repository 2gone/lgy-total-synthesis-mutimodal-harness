[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tsdaf"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
router = [
  "openai>=2.29,<3",
  "pydantic-settings>=2.7,<3",
]
image = [
  "Pillow>=12,<13",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
research = [
  "openai>=2.29,<3",
  "PyMuPDF>=1.27",
  "pdfplumber>=0.11",
  "pypdfium2>=5.11",
  "Pillow>=12,<13",
  "jsonschema>=4.25",
]
fusion = []
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
tsdaf = "tsdaf.apps.cli:main"
tsdaf-web = "tsdaf.apps.web.server:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["tsdaf*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
tsdaf = ["py.typed", "apps/web/static/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["tests/legacy_harness"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["^tests/legacy_harness/"]
